# 章节播放内容变更流水线（仅 .story.txt，不含书写稿 .md）
# 书写模型改 chapterN.md → coding agent 转 chapterN.story.txt → 推送后触发本流水线
name: Story Update

on:
  push:
    branches: [main]
    paths:
      - 'src/stories/**/*.story.txt'
  pull_request:
    paths:
      - 'src/stories/**/*.story.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 剧情编译与引擎测试
        run: npm test

      - name: 列出本次变更的章节文件
        if: github.event_name == 'push'
        run: |
          echo "变更的章节文件："
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'src/stories/**/*.story.txt' || true
